# Paper-aligned noise model parameters
# These keys mirror the parameters listed in the repository README under
# “Paper-aligned 噪声模型参数 / 默认参数取值（来自论文 Table S4）”.
# The adapter delegates to the canonical implementation included in the repo.
#
# Cycle timing
cycle_ns: 1076.0          # surface code cycle time (ns)

# Single-qubit decoherence (applied across 1Q gates / idles)
T1_us: 73.0
Tphi_us: 720.0            # Pure dephasing time (NOT T2)
T2_CPMG_us: 80.0          # Reference: CPMG-measured coherence

# Readout / reset (classical flips + leakage outcome handling inside impl)
p_readout: 8.0e-3
p_reset:   1.5e-3

# Heating / DQLR (handled by paper implementation)
p_heat_01: 0.0
p_heat_12: 2.5e-4
# dqlr_matrix can be set if the implementation expects a matrix; leave null to use defaults
dqlr_matrix: null

# CZ-related correlated errors and leakage
p_cz_depolarizing: 7.0e-3   # Paper: 2Q gate depolarizing error
p_cz_crosstalk_ZZ: 5.5e-4
p_cz_swap_like:    0.0      # (XX+YY)/2; set per device if needed
p_cz_leak_11_to_02: 2.0e-4
p_cz_leak_11_to_20: 2.0e-4  # Paper: symmetric leakage to both |02⟩ and |20⟩

# Residual Pauli-like excess errors (paper uses these to match component budgets)
p_1q_excess: 6.2e-4
p_cz_excess: 2.75e-3
p_idle_excess: 0.0

# ============================================================
# NEW: READOUT CROSSTALK (Section 3.2.1)
# ============================================================
# Probability that measuring one qubit affects neighbor's readout
p_readout_crosstalk: 1.0e-3

# ============================================================
# NEW: BURST/COSMIC RAY ERRORS (Section 3.3.2)
# ============================================================
# Cosmic ray events cause correlated multi-qubit errors
p_burst: 1.0e-5                 # Probability of burst event per cycle
p_depol_given_burst: 0.5        # Depolarization prob given burst

# ============================================================
# NEW: MEASUREMENT-INDUCED RESET (Section 3.2.3)
# ============================================================
# State-dependent reset fidelity after measurement
p_reset_from_0: 0.001           # Reset error when starting from |0⟩
p_reset_from_1: 0.002           # Reset error when starting from |1⟩
p_reset_from_L: 0.05            # Reset error when starting from |2⟩

# ============================================================
# NEW: LEAKAGE SEEPAGE (Section 3.4.1)
# ============================================================
# Leakage in one qubit can "seep" into neighbors
p_leakage_seepage: 5.0e-5

# ============================================================
# NEW: STATE-DEPENDENT T1 (Section 3.1.2)
# ============================================================
# Different decay rates for different state transitions
gamma_10: 0.0                   # |1⟩→|0⟩ (0 = computed from T1)
gamma_21: 0.0                   # |2⟩→|1⟩ (typically ~2× gamma_10)

# ============================================================
# NEW: TEMPORAL DRIFT (Section 4.2)
# ============================================================
enable_temporal_drift: false    # Enable time-varying noise
drift_amplitude: 0.1            # Fractional drift amplitude

# ============================================================
# NEW: FREQUENCY COLLISION (Section 3.4.3)
# ============================================================
# Coherent exchange when qubits are near resonance
p_frequency_collision: 1.0e-4

# Default data generation basis ('x' or 'z'); CLI can override
default_basis: z

# ============================================================
# SPATIAL VARIATION (Replicating Google's Device Heterogeneity)
# ============================================================
# Real devices have per-qubit/per-edge parameter variations
use_spatial_variation: true   # Enable per-qubit parameter variation
spatial_seed: 42              # Seed for reproducibility

# Option to use pre-generated realistic calibration file
# If set, loads exact p_ij values from JSON instead of generating
use_realistic_calibration: false
realistic_calibration_file: null  # e.g., "configs/realistic_calibration_d5.json"

# Calibration generation options (when use_realistic_calibration=false)
include_bad_qubits: true      # Simulate defect qubits
bad_qubit_fraction: 0.05      # 5% of qubits have elevated errors
include_freq_collisions: true # Some edges have frequency collision

# ============================================================
# Training hyperparameters (from Nature 2024 paper)
# ============================================================
training:
  # Pretraining configuration (Section: Methods - Training procedure)
  samples: 8500000        # 8.5M samples for pretraining
  epochs: 100             # 100 epochs for pretraining
  batch_size: 256         # Batch size 256
  lr: 1.0e-4              # Learning rate 1e-4 for pretraining
  weight_decay: 1.0e-3    # L2 regularization
  train_split: 0.95       # 95% train, 5% validation
  
  # Model architecture (Section: Methods - Decoder architecture)
  hidden_dim: 256         # Hidden dimension d=256
  num_heads: 8            # 8 attention heads
  num_layers: 12          # 12 transformer layers
  head_dim: 32            # d/h = 256/8 = 32
  ff_expansion: 2         # FFN expansion factor (512 = 256 * 2)
  
  # Optimizer (AdamW)
  optimizer: adamw
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  
  # Learning rate schedule
  warmup_steps: 1000      # Linear warmup
  scheduler: cosine       # Cosine annealing

# ============================================================
# Fine-tuning configuration (separate from pretraining)
# ============================================================
finetuning:
  samples: 50000          # 50K samples for fine-tuning
  epochs: 30              # 30 epochs
  batch_size: 128         # Smaller batch for fine-tuning
  lr: 1.0e-5              # Lower LR (1e-5) for fine-tuning
  weight_decay: 1.0e-3    # Same weight decay
  patience: 5             # Early stopping patience
